<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zel Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body-grid"></div>
    <div class="page-shell">
        <header class="topbar">
            <h1>Zel Dashboard</h1>
        </header>
        <main class="layout">
            <section class="hero-card">
                <div class="avatar-panel">
                    <img src="mangap.png" alt="Avatar" class="avatar-image">
                </div>
                <div class="info-panel">
                    <div class="info-header">
                        <h2>Captain</h2>
                        <p class="subtitle">Content creator kecil</p>
                    </div>
                    <ul class="info-list">
                        <li><strong>Nama :</strong>Ell</li>
                        <li><strong>Hobi :</strong>Makan</li>
                        <li><strong>Umur :</strong>Sesuai Tahun</li>
                    </ul>
                </div>
            </section>

            <section class="circle-row" role="group" aria-label="Circle links">
                <a href="https://www.tiktok.com" target="_blank" class="circle-bubble bubble-1" title="TikTok">
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="https://discord.gg/2MrR8kYazv" target="_blank" class="circle-bubble bubble-2" title="Discord">
                    <i class="fab fa-discord"></i>
                </a>
                <a href="https://www.youtube.com" target="_blank" class="circle-bubble bubble-3" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
            </section>

            <section class="social-bar">
                <span>Social</span>
            </section>

            <section class="wa-panel">
                <a href="https://wa.me/6281234567890" target="_blank" class="wa-button" title="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                    <span>Chat via WhatsApp</span>
                </a>
                <div class="social-links">
                    <a href="https://www.buymeacoffee.com/username" target="_blank" class="donate-button" title="Donate">
                        <i class="fas fa-donate"></i>
                        <span>Donate</span>
                    </a>
                </div>
            </section>

            <section class="suggestion-bar">
                <span>Butuh update konten terbaru? Follow YouTube atau cek TikTok dan Discord juga.</span>
            </section>
        </main>
    </div>
    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const CLICK_SOUND_DURATION = 80;

        function playClickSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'square';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.12, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + CLICK_SOUND_DURATION / 1000);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + CLICK_SOUND_DURATION / 1000);
        }

        function ensureAudioReady() {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playHoverSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'triangle';
            osc.frequency.value = 440;
            gain.gain.setValueAtTime(0.08, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start(audioContext.currentTime);
            osc.stop(audioContext.currentTime + 0.05);
        }

        document.querySelectorAll('a, button').forEach(element => {
            element.addEventListener('pointerenter', () => {
                ensureAudioReady();
                playHoverSound();
            });
        });

        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('pointerdown', () => {
                ensureAudioReady();
                playClickSound();
            });
        });

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('pointerdown', ensureAudioReady);
            link.addEventListener('click', event => {
                event.preventDefault();
                playClickSound();
                const href = link.href;
                setTimeout(() => {
                    window.open(href, link.target || '_self');
                }, CLICK_SOUND_DURATION);
            });
        });

        document.addEventListener('pointerdown', ensureAudioReady, { once: true });
    </script>
</body>
</html>
